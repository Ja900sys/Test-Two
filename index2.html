<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incident Ticket</title>

<style>

body{
    font-family: Arial, sans-serif;
    background-color: darkkhaki;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
}

.container{
    width:450px;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 4px 12px rgba(0,0,0,.2);

    display:flex;
    flex-direction:column;
    gap:15px;
}

h2{
    text-align:center;
    margin:0;
}

input,
select,
textarea{
    width:100%;
    padding:10px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}

textarea{
    height:120px;
    resize:none;
}

.textarea-container{
    position:relative;
}

#descCount{
    position:absolute;
    bottom:10px;
    right:10px;
    color:gray;
    font-size:12px;
}

.radio-group{
    display:flex;
    justify-content:center;
    gap:20px;
}

.submit-btn{
    background:darkred;
    color:white;
    border:none;
    padding:15px;
    border-radius:8px;
    cursor:pointer;
}

.submit-btn:hover{
    background:green;
}

.dark{
    background:#121212;
}

.dark .container{
    background:#1e1e1e;
    color:white;
}

.dark input,
.dark select,
.dark textarea{
    background:#444;
    color:white;
    border:1px solid #888;
}

.dark input::placeholder,
.dark textarea::placeholder{
    color:#ccc;
}

.dark-mode-btn{
    position:fixed;
    top:20px;
    right:20px;

    width:60px;
    height:60px;

    border:none;
    border-radius:50%;

    background:#333;
    color:white;

    font-size:28px;
    cursor:pointer;
}

</style>
</head>

<body>

<button class="dark-mode-btn" onclick="toggleTheme()">
    <span id="themeIcon">🌙</span>
</button>

<div class="container">

<h2> Incident Ticket</h2>

<input type="text"
       id="name"
       placeholder="Enter Full Name">

<input type="email"
       id="email"
       placeholder="Enter Email">

<input type="text"
       id="subject"
       placeholder="Subject">

<div class="textarea-container">

<textarea id="description"
          placeholder="Describe the issue"></textarea>

<span id="descCount">Words: 0</span>

</div>

<input type="date" id="date">

<select id="category">
    <option value="">Select Category</option>
    <option>IT Support</option>
    <option>Facilities</option>
    <option>General Inquiry</option>
</select>

<select id="priority">
    <option value="">Select Priority</option>
    <option>High</option>
    <option>Mid</option>
    <option>Low</option>
</select>

<p><strong>Work Location</strong></p>

<div class="radio-group">

<label>
<input type="radio"
       name="workLocation"
       value="Home">
Home
</label>

<label>
<input type="radio"
       name="workLocation"
       value="Office">
Office
</label>

<label>
<input type="radio"
       name="workLocation"
       value="Hybrid">
Hybrid
</label>

</div>

<input type="file" id="attachment">

<button class="submit-btn"
        onclick="validateForm()">
Submit Ticket
</button>

</div>

<script>


const description =
document.getElementById("description");

const descCount =
document.getElementById("descCount");

description.addEventListener("input", function(){

    let words = this.value.trim()
    .split(/\s+/)
    .filter(word => word.length > 0);

    descCount.textContent =
    "Words: " +
    (this.value.trim() === "" ? 0 : words.length);

});


function toggleTheme(){

    document.body.classList.toggle("dark");

    let icon =
    document.getElementById("themeIcon");

    if(document.body.classList.contains("dark")){
        icon.textContent = "☀️";
    }
    else{
        icon.textContent = "🌙";
    }
}
function validateForm(){

    const name =
    document.getElementById("name");

    const email =
    document.getElementById("email");

    const subject =
    document.getElementById("subject");

    const category =
    document.getElementById("category");

    const priority =
    document.getElementById("priority");

    const date =
    document.getElementById("date");

    const workLocation =
    document.querySelector(
    'input[name="workLocation"]:checked'
    );

    if(
        name.value === "" ||
        email.value === "" ||
        subject.value === "" ||
        description.value === "" ||
        category.value === "" ||
        priority.value === "" ||
        date.value === ""
    ){
        alert("Please complete all fields.");
        return;
    }

    if(!workLocation){
        alert("Select a Work Location.");
        return;
    }

   
   window.location.href = "success2.html";
}

</script>

</body>
</html>
